name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      # Real Postgres + pgvector so the schema and vector-extension tests actually run.
      # Without it they self-skip, and schema.sql would go unverified forever.
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: claimguard
          POSTGRES_PASSWORD: claimguard
          POSTGRES_DB: claimguard
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U claimguard"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # No provider key in CI, by design: the suite must pass offline on the mock.
      # tests/conftest.py pins LLM_PROVIDER=mock at import time — a real call here
      # would mean a test is reaching the network, which is itself the bug.
      LLM_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build   # `tsc -b && vite build` — typecheck is already in here
